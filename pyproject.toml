[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bk-foundry"
version = "0.1.0"
description = "BK's catalog automation programs and the BK-PACK interchange core."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "boto3",
    "pillow",
    "pymupdf",
    "beautifulsoup4",
    "playwright",
    "pytest",
    "ruff",
]

# Importable packages live under packages/ (bkpack, common) and programs/
# (scraper), made available via a normal editable install (pip install -e .) —
# no sys.path or PYTHONPATH hacks anywhere.
[tool.setuptools.packages.find]
where = ["packages", "programs"]

[tool.pytest.ini_options]
testpaths = ["tests", "programs/scraper/tests"]

[tool.ruff]
target-version = "py312"

# Full default ruff rules apply to every foundry file we author. The only
# exception is the frozen, byte-for-byte locked dependency (the BK-PACK core and
# its test): those must not be reformatted, so the style/modernization rules
# newer ruff enables by default (I001/UP045/UP017/RUF022) are ignored for those
# files only. Everything else obeys the full default rule set.
[tool.ruff.lint.per-file-ignores]
"packages/bkpack/*" = ["I001", "UP045", "UP017", "RUF022"]
"tests/test_bkpack.py" = ["I001", "UP045", "UP017", "RUF022"]
